# Tensyoki Linux Port - 配置文件
# 复制此文件到 config.toml 并根据需要修改

[window]
width = 1280
height = 720
title = "Tensyoki Linux Port"
fullscreen = false
vsync = true
resizable = true
high_dpi = true
borderless = false
max_fps = 0  # 0 = 无限制

[paths]
# 数据根目录 (包含 res/ 目录)
# 优先级: 命令行参数 > 环境变量 TENSYOKI_DATA_ROOT > 此配置 > 自动检测
data_root = ""

[game]
language = "ja"  # ja, zh, en

[audio]
master_volume = 1.0
music_volume = 1.0
sfx_volume = 1.0

[renderer]
backend = "opengl"  # opengl, vulkan (vulkan 尚未实现)
msaa_samples = 0
debug_overlay = false